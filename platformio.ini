[env:m5dial]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

board_build.flash_size       = 8MB
board_build.partitions       = default_8MB.csv
board_upload.flash_size      = 8MB
board_build.filesystem       = littlefs

; Lo-fi vector map data (Natural Earth, ~292 KB) linked into flash rodata and
; accessed directly via _binary_lofimap_bin_start/_end (see lofimap.cpp). The
; pre-build script objcopies assets/lofimap.bin into a linkable object — the
; Arduino framework doesn't support board_build.embed_files. Regenerate the blob
; with tools/build_lofimap.py.
extra_scripts = pre:tools/embed_lofimap.py

; Arduino USB CDC (needed for Serial over USB on S3)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    m5stack/M5Dial
    bblanchon/ArduinoJson @ ^7.2.0
    tzapu/WiFiManager @ >=2.0.16
