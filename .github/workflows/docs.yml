name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
      - 'src/**'
      - 'platformio.ini'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install mkdocs-material

      - run: mkdocs build --strict

      # ── Firmware build & publish ──────────────────────────────────────────
      # Published into the same site/ dir as the docs, as part of the single
      # deploy below — actions/deploy-pages fully replaces the live site on
      # every run, so a second, independently-triggered workflow deploying to
      # Pages would race this one and silently delete whatever it last
      # published (or vice versa). Building firmware on every docs-only push
      # too is a deliberate trade: slower CI, but no overwrite race to reason
      # about.
      - run: pip install -U platformio

      - name: Build firmware
        run: pio run -e m5dial

      # esp-web-tools (the browser flasher on the Flash Firmware page) wants
      # one binary at offset 0 rather than the bootloader/partition-table/
      # boot_app0/app quartet at their individual offsets — PlatformIO
      # already merges exactly that into firmware.factory.bin during the
      # build above, so publishing it (instead of assembling the four parts
      # and their offsets ourselves) can't drift from what the board actually
      # needs even if the partition table changes later.
      - name: Publish firmware + manifest for browser flashing
        run: |
          VERSION=$(grep -oP '#define\s+FIRMWARE_VERSION\s+"\K[^"]+' src/config.h)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract FIRMWARE_VERSION from src/config.h" >&2
            exit 1
          fi
          if ! grep -q "^## $VERSION\$" docs/changelog.md; then
            echo "::error::docs/changelog.md has no '## $VERSION' entry matching FIRMWARE_VERSION — add one before releasing" >&2
            exit 1
          fi
          mkdir -p site/firmware
          cp .pio/build/m5dial/firmware.factory.bin site/firmware/firmware.factory.bin
          cat > site/firmware/manifest.json <<EOF
          {
            "name": "Frank's Flight Radar",
            "version": "$VERSION",
            "new_install_prompt_erase": false,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "firmware.factory.bin", "offset": 0 }
                ]
              }
            ]
          }
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
